name: Build GPUFl Client

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'Dockerfile*'
      - '**/Dockerfile'
      - '**/Dockerfile.*'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES.txt'
      - '.gitignore'
      - 'images/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'Dockerfile*'
      - '**/Dockerfile'
      - '**/Dockerfile.*'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES.txt'
      - '.gitignore'
      - 'images/**'

# Every job reads the repository and nothing else; a job that needs more
# names it in its own permissions block, which replaces this one.
permissions:
  contents: read

jobs:
  amd-startup:
    name: AMD preload startup (CPU only)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/inject/test_amd_startup.py

  linux-wheels:
    # The Linux wheels release.yml publishes, built the same way. cibuildwheel
    # installs each into a fresh venv and runs the check: the `gpufl` command
    # is on PATH, reports the wheel's version, `gpufl trace` finds
    # libgpufl_inject.so, and the wheel keeps its OpenSSL to itself.
    # release.yml runs the same check before publishing.
    name: Linux wheels - gpufl command from a fresh venv
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build the Linux wheels and check each in a fresh venv
        uses: pypa/cibuildwheel@v3.4.1
        env:
          # Copied from release.yml's build_wheels job, whose comments explain
          # each setting. Change the two together.
          CIBW_BUILD: "cp312-manylinux_x86_64 cp313-manylinux_x86_64 cp314-manylinux_x86_64"
          CIBW_MANYLINUX_X86_64_IMAGE: quay.io/pypa/manylinux_2_28_x86_64:2026.05.17-1
          CIBW_ENVIRONMENT_LINUX: "CUDA_HOME=/usr/local/cuda PATH=/usr/local/cuda/bin:$PATH CMAKE_ARGS='-DGPUFL_ENABLE_NVIDIA=ON -DGPUFL_ENABLE_AMD=OFF -DBUILD_TESTING=OFF -DGPUFL_PRIVATE_OPENSSL=ON -DOPENSSL_ROOT_DIR=/opt/gpufl-openssl'"
          CIBW_BEFORE_ALL_LINUX: >-
            curl -fsSL https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo > /etc/yum.repos.d/cuda.repo &&
            dnf install -y --nogpgcheck cuda-nvcc-13-1 cuda-cudart-devel-13-1 cuda-cupti-13-1 cuda-driver-devel-13-1 cuda-nvml-devel-13-1 perl-core openssl openssl3-libs &&
            bash {project}/scripts/build-static-openssl.sh /opt/gpufl-openssl
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair --plat manylinux_2_28_x86_64 --exclude libcuda.so.1 --exclude libnvidia-ml.so.1 -w {dest_dir} {wheel}"
          CIBW_TEST_COMMAND_LINUX: python {project}/tests/package/check_wheel_launcher.py

      - uses: actions/upload-artifact@v4
        with:
          name: linux-wheels
          path: ./wheelhouse/*.whl
          retention-days: 7

  linux-wheels-ubuntu-host:
    # The same check on an Ubuntu host, where the OpenSSL problem it guards
    # against shows. Up to 1.3.0rc8 the wheel bundled EL8's shared OpenSSL,
    # and `gpufl trace` brought it into the traced program: Ubuntu's Python
    # then looked for CA certificates under EL8's /etc/pki/tls and found
    # none. Inside the manylinux container that cannot show, because
    # /etc/pki/tls exists there and the image's Python links OpenSSL 1.1.1.
    # Here check 6 runs the runner's own Pythons, whose ssl module loads
    # libssl.so.3, and check 7 adds its test CA to Ubuntu's trust store with
    # sudo, which exercises gpufl's CA bundle discovery on the Debian layout.
    # Stand-in driver libraries replace libcuda and NVML; nothing needs a GPU.
    # Pull requests only: release.yml relies on the in-container check, so
    # this job's runner cannot hold up a release.
    name: Linux wheels - OpenSSL on an Ubuntu host (py${{ matrix.python-version }})
    needs: linux-wheels
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-wheels
          path: wheelhouse

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the wheel into a fresh venv
        run: |
          tag="cp$(echo '${{ matrix.python-version }}' | tr -d .)"
          python -m venv "$RUNNER_TEMP/gpufl-venv"
          "$RUNNER_TEMP/gpufl-venv/bin/pip" install wheelhouse/gpufl-*-"$tag"-"$tag"-*.whl

      - name: Check the gpufl command and its OpenSSL
        env:
          GPUFL_WHEEL_CHECK_STRICT: "1"
          GPUFL_WHEEL_CHECK_SUDO: "1"
          GPUFL_WHEEL_CHECK_STANDIN_DRIVER: "1"
          GPUFL_WHEEL_CHECK_REQUIRE_OPENSSL3_PYTHON: "1"
        run: '"$RUNNER_TEMP/gpufl-venv/bin/python" tests/package/check_wheel_launcher.py'

  build:
    name: Build on ${{ matrix.os }} py${{ matrix.python-version }} perfworks=${{ matrix.perfworks }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Pin windows-2022 (VS 2022): windows-latest moved to VS 2026 (Jun
        # 2026), whose MSVC toolset CUDA 13.x nvcc doesn't support.
        os: [ubuntu-22.04, windows-2022]
        python-version: ["3.12", "3.13", "3.14"]
        perfworks: ["ON"]  # quoted: unquoted ON/OFF are YAML 1.1 booleans
        include:
          # Release wheels build without PerfWorks (manylinux ships no nvperf)
          # and nothing else here does. One job is enough for a link error.
          - os: ubuntu-22.04
            python-version: "3.12"
            perfworks: "OFF"

    env:
      CMAKE_ARGS: >-
        -DGPUFL_ENABLE_NVIDIA=ON
        -DGPUFL_ENABLE_AMD=OFF
        -DGPUFL_ENABLE_PERFWORKS=${{ matrix.perfworks }}
        -DBUILD_TESTING=OFF

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Install CUDA Toolkit (provides CUDA_PATH)
      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.30
        id: cuda-toolkit
        with:
          cuda: '13.1.0'
          method: 'network'
          use-github-cache: false

      # Make sure CMake can find CUDA headers/libraries during the *pip build*.
      # Jimver/cuda-toolkit sets CUDA_PATH; we map it to common vars CMake respects.
      - name: Export CUDA environment for CMake
        shell: bash
        run: |
          echo "CUDA_HOME=${CUDA_PATH}" >> $GITHUB_ENV
          echo "CUDAToolkit_ROOT=${CUDA_PATH}" >> $GITHUB_ENV
          if [ "${{ runner.os }}" == "Windows" ]; then
            echo "${CUDA_PATH}/bin" >> $GITHUB_PATH
            echo "${CUDA_PATH}/extras/CUPTI/lib64" >> $GITHUB_PATH
            echo "C:/Program Files/NVIDIA Corporation/NVSMI" >> $GITHUB_PATH
            # Build with Ninja + nvcc + MSVC cl (cl set up by the msvc-dev-cmd step
            # below). The VS generator with a `cuda=<path>` toolset needs the CUDA
            # Visual Studio integration installed into VS, which the network CUDA
            # install omits -> CMake reported "could not find any instance of Visual
            # Studio" at project(). Ninja + nvcc detects CUDA from PATH instead.
            echo "CMAKE_GENERATOR=Ninja" >> $GITHUB_ENV
          fi

      # Put MSVC cl/link on PATH so Ninja has a C++ compiler and nvcc has its host
      # compiler. Must run before the pip build below.
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scikit-build-core pybind11 cmake==3.31.6 ninja

      - name: Build and Install
        run: |
          pip install .[viz,analyzer] -v

      - name: Run C++ Unit Tests
        # Skip C++ tests on Windows as they require actual NVIDIA GPUs to run (CUDA/CUPTI initialization)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # 1. Prepare a local writable directory for CUDA stubs
          # We cannot write to the system CUDA directory (Permission denied).
          LOCAL_STUBS_DIR="${GITHUB_WORKSPACE}/local_cuda_stubs"
          mkdir -p "${LOCAL_STUBS_DIR}"

          # 2. Gather relevant library directories for the CUDA Toolkit
          STUBS_DIR="${CUDA_HOME}/targets/x86_64-linux/lib/stubs"
          LIBS_DIR="${CUDA_HOME}/targets/x86_64-linux/lib"
          
          # 3. Create versioned symlinks in the LOCAL directory
          # Many binaries expect .so.1 which is only created by the driver installer.
          for lib in libcuda libnvidia-ml libnvrtc; do
            if [ -f "${STUBS_DIR}/${lib}.so" ]; then
              # Symlink the original stub to our local dir
              ln -sf "${STUBS_DIR}/${lib}.so" "${LOCAL_STUBS_DIR}/${lib}.so"
              # Create the versioned symlink in our local dir
              ln -sf "${lib}.so" "${LOCAL_STUBS_DIR}/${lib}.so.1"
            fi
          done

          # 4. Add local stubs and toolkit libs to LD_LIBRARY_PATH
          export LD_LIBRARY_PATH="${LOCAL_STUBS_DIR}:${LIBS_DIR}:${LD_LIBRARY_PATH}"
          
          # Debug: check what libraries are found
          echo "LD_LIBRARY_PATH: $LD_LIBRARY_PATH"
          ls -l "${LOCAL_STUBS_DIR}" || true

          cmake -B build_tests -S . \
            -DGPUFL_ENABLE_NVIDIA=ON \
            -DBUILD_PYTHON=OFF \
            -DBUILD_TESTING=ON
          
          cmake --build build_tests --target gpufl_tests
          
          ctest --test-dir build_tests --output-on-failure --verbose --timeout 60

      - name: Run Python Unit Tests
        shell: bash
        run: |
          python -m pip install pytest
          export PYTHONPATH=$PYTHONPATH:$(pwd)/python
          python -m pytest tests/python

      - name: Verify Logging Pipeline
        run: |
          python -u tests/verify_pipeline.py

  build-macos:
    name: Build macOS Metal monitor
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install cmake==3.31.6

      - name: Build native Metal monitor
        run: ./build.sh --monitor --build-dir build-macos-ci

      - name: Configure C++ tests
        run: |
          cmake -S . -B build-macos-ci \
            -DBUILD_TESTING=ON \
            -DBUILD_GPUFL_EXAMPLE=OFF \
            -DBUILD_PYTHON=OFF \
            -DBUILD_GPUFL_MONITOR=ON \
            -DBUILD_GPUFL_LAUNCHER=OFF \
            -DBUILD_GPUFL_INJECT=OFF \
            -DGPUFL_ENABLE_NVIDIA=OFF \
            -DGPUFL_ENABLE_AMD=OFF \
            -DGPUFL_ENABLE_METAL=ON

      - name: Run C++ unit tests
        run: |
          cmake --build build-macos-ci --target gpufl_tests --parallel
          ctest --test-dir build-macos-ci --output-on-failure --verbose --timeout 60
